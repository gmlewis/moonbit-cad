<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assembly preview</title>
<style>
html, body { margin: 0; height: 100%; background: #fbfbfd; color: #1d1d1f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
@media (prefers-color-scheme: dark) { html, body { background: #111113; color: #e8e8ed; } }
.model-panel { position: relative; width: 100%; height: 100vh; overflow: hidden; background: radial-gradient(circle at 50% 30%, rgba(120, 160, 220, 0.18), transparent 70%); }
.model-panel canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.model-panel [hidden] { display: none !important; }
.model-fallback { display: block; width: 100%; height: 100%; object-fit: contain; }
.model-hint { position: absolute; left: 0.75rem; bottom: 0.65rem; padding: 0.25rem 0.6rem; border-radius: 999px; border: 1px solid rgba(128, 128, 128, 0.35); background: rgba(127, 127, 127, 0.12); font-size: 0.8rem; opacity: 0.9; }
</style>
</head>
<body>
<div class="model-panel">
  <img class="model-fallback" src="views/iso.png" alt="Isometric assembly view">
  <canvas hidden aria-label="Interactive 3D assembly view"></canvas>
  <div class="model-hint" hidden></div>
</div>

<script type="module" src="viewer.js"></script>
</body>
</html>
